<nav class="navbar navbar-expand-lg">
  <div class="container-fluid px-4">
    <a class="navbar-brand fw-bold text-info" [routerLink]="auth.isLoggedIn() ? '/profile' : '/'">StudyVera</a>

    <button class="navbar-toggler" (click)="toggleNavMenu()">
      <span class="navbar-toggler-icon"></span>
    </button>

    <div class="collapse navbar-collapse" [class.show]="!isMenuCollapsed">
      <ul class="navbar-nav">
        @if (!auth.isLoggedIn()) {
        <li class="nav-item"><a class="nav-link" routerLink="/"><i class="bi bi-house-door me-2"></i>Ana Sayfa</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/info"><i class="bi bi-info-circle me-2"></i>Bilgi</a></li>
        }

        <li class="nav-item"><a class="nav-link" routerLink="/pomodoro"><i class="bi bi-stopwatch me-2"></i>Pomodoro</a>
        </li>
        <li class="nav-item"><a class="nav-link" routerLink="/sayac"><i class="bi bi-clock-history me-2"></i>Sayaç</a>
        </li>

        @if (auth.isLoggedIn()) {
        <li class="nav-item"><a class="nav-link" routerLink="/profile"><i
              class="bi bi-person-circle me-2"></i>Profil</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/profile/user-lesson-progresses"><i
              class="bi bi-graph-up-arrow me-2"></i>İlerleme Takibi</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/profile/solved-questions"><i
              class="bi bi-pencil-square me-2"></i>Sorular</a></li>
        }

      </ul>

      <ul class="navbar-nav ms-auto align-items-center">
        @if (!auth.isLoggedIn()) {
        <li class="nav-item"><a class="nav-link" routerLink="/auth/login"><i
              class="bi bi-box-arrow-in-right me-2"></i>Giriş Yap</a></li>
        <li class="nav-item"><a class="nav-link" routerLink="/auth/register"><i class="bi bi-person-plus me-2"></i>Kayıt
            Ol</a></li>
        } @else {
        <li class="nav-item"><a class="nav-link me-2" routerLink="/profile/settings"><i
              class="bi bi-gear-fill me-2"></i>Ayarlar</a></li>
        <li class="nav-item"><button class="btn btn-outline-danger btn-sm" (click)="logout()"><i
              class="bi bi-box-arrow-right me-2"></i>Çıkış</button></li>
        }

        <li class="nav-item ms-2">
          <button class="btn btn-outline-secondary" (click)="theme.toggle()">
            {{ theme.theme() === 'dark' ? '🌙 Gece' : '☀️ Gündüz' }}
          </button>
        </li>
      </ul>
    </div>
  </div>
</nav>
