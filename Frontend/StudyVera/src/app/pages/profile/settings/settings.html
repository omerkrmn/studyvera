<div class="container-fluid settings-container py-4">
  <div class="row align-items-start">
    <!-- Sidebar / Top Tabs (Responsive) -->
    <div class="col-12 col-md-3 border-end-md settings-nav-col">
      <div class="nav flex-row flex-md-column nav-pills gap-2 pt-2 text-start w-100 flex-nowrap overflow-x-auto pb-2 pb-md-0">
        <button class="nav-link text-start w-100 py-3 px-4 d-flex align-items-center gap-2"
                [class.active]="activeTab === 'application-parameters'"
                (click)="changeTab('application-parameters')">
          <i class="bi bi-gear-fill fs-5"></i>
          <span>Uygulama Parametreleri</span>
        </button>

        <button class="nav-link text-start w-100 py-3 px-4 d-flex align-items-center gap-2"
                [class.active]="activeTab === 'pomodoro-settings'"
                (click)="changeTab('pomodoro-settings')">
          <i class="bi bi-palette-fill fs-5"></i>
          <span>Pomodoro Ayarları</span>
        </button>
      </div>
    </div>

    <!-- Content Panel -->
    <div class="col-12 col-md-9 p-3 p-md-4">
      <div class="alert alert-info border-0 shadow-sm rounded-4 d-flex align-items-center gap-3 mb-4" role="alert">
        <i class="bi bi-info-circle-fill text-info fs-4"></i>
        <div>
          Ayarlarınız yerel olarak önbelleğe alınır. Eğer önbellekte veri yoksa veritabanından getirilir, böylece sistem gereksiz yere meşgul edilmez.
        </div>
      </div>

      <div class="tab-content-wrapper">
        @if (activeTab === 'application-parameters') {
          <app-application-parameters></app-application-parameters>
        } @else if (activeTab === 'pomodoro-settings') {
          <app-pomodoro-settings></app-pomodoro-settings>
        }
      </div>
    </div>
  </div>
</div>
